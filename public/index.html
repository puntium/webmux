<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webmux</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <style>
    :root {
      --bg: #16161e;
      --panel: #1f1f2b;
      --border: #34344a;
      --text: #c8c8d8;
      --accent: #7aa2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.04em; }
    header button {
      background: var(--accent);
      color: #10101a;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    header button:hover { filter: brightness(1.1); }
    #status { font-size: 12px; opacity: 0.6; }
    #layout {
      flex: 1;
      display: flex;
      padding: 6px;
      min-height: 0;
      min-width: 0;
    }
    #layout > * { flex: 1 1 0; }
    .split {
      display: flex;
      min-width: 0;
      min-height: 0;
    }
    .split.row { flex-direction: row; }
    .split.col { flex-direction: column; }
    .divider {
      flex: none;
      background: var(--border);
      border-radius: 3px;
      transition: background 0.15s;
      touch-action: none;
    }
    .divider:hover, .divider:active { background: var(--accent); }
    .divider.row { width: 6px; cursor: col-resize; margin: 0 1px; }
    .divider.col { height: 6px; cursor: row-resize; margin: 1px 0; }
    .tile {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .tile.exited { opacity: 0.5; }
    .tile-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .tile-actions { display: flex; gap: 2px; }
    .tile-actions button {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      opacity: 0.6;
      padding: 0 4px;
    }
    .tile-actions button:hover { opacity: 1; color: var(--accent); }
    .tile-actions .close:hover { color: #f7768e; }
    .term-holder { flex: 1; min-height: 0; padding: 4px; }
    .term-holder .xterm { height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>webmux</h1>
    <button id="new-session">+ New terminal</button>
    <span id="status"></span>
  </header>
  <div id="layout"></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
