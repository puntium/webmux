<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webmux</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="preload" href="/fonts/JetBrainsMonoNerdFont-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-Bold.woff2') format('woff2');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-Italic.woff2') format('woff2');
      font-weight: normal;
      font-style: italic;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-BoldItalic.woff2') format('woff2');
      font-weight: bold;
      font-style: italic;
    }
    :root {
      --bg: #16161e;
      --panel: #1f1f2b;
      --border: #34344a;
      --text: #c8c8d8;
      --accent: #7aa2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.04em; }
    header button {
      background: var(--accent);
      color: #10101a;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    header button:hover { filter: brightness(1.1); }
    #status { font-size: 12px; opacity: 0.6; }
    #layout {
      flex: 1;
      display: flex;
      padding: 6px;
      min-height: 0;
      min-width: 0;
    }
    #layout > * { flex: 1 1 0; }
    .split {
      display: flex;
      min-width: 0;
      min-height: 0;
    }
    .split.row { flex-direction: row; }
    .split.col { flex-direction: column; }
    .divider {
      flex: none;
      background: var(--border);
      border-radius: 3px;
      transition: background 0.15s;
      touch-action: none;
    }
    .divider:hover, .divider:active { background: var(--accent); }
    .divider.row { width: 6px; cursor: col-resize; margin: 0 1px; }
    .divider.col { height: 6px; cursor: row-resize; margin: 1px 0; }
    .pane {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .pane.drop-target { border-color: var(--accent); }
    .pane-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      flex: none;
      min-width: 0;
    }
    .tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      min-width: 0;
      scrollbar-width: none;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 120px;
      max-width: 200px;
      padding: 2px 4px 2px 9px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      opacity: 0.55;
    }
    .tab-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab:hover { opacity: 0.9; background: rgba(255, 255, 255, 0.05); }
    .tab.active { opacity: 1; background: rgba(122, 162, 247, 0.15); color: var(--accent); }
    .tab.dragging { opacity: 0.3; }
    .tab.drop-before { box-shadow: -2px 0 0 0 var(--accent); }
    .tab.drop-after { box-shadow: 2px 0 0 0 var(--accent); }
    .tab-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 10px;
      opacity: 0.5;
      padding: 0 3px;
    }
    .tab-close:hover { opacity: 1; color: #f7768e; }
    .new-tab, .pane-actions button {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      opacity: 0.6;
      padding: 0 4px;
    }
    .new-tab:hover, .pane-actions button:hover { opacity: 1; color: var(--accent); }
    .pane-actions { display: flex; gap: 2px; flex: none; margin-left: auto; }
    .pane-body { flex: 1; display: flex; min-width: 0; min-height: 0; }
    .tile {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .tile.exited { opacity: 0.5; }
    .term-holder { flex: 1; min-height: 0; padding: 4px; }
    .term-holder .xterm { height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>webmux</h1>
    <button id="new-session">+ New terminal</button>
    <span id="status"></span>
  </header>
  <div id="layout"></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
