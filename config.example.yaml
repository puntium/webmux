# Copy to config.yaml (gitignored) to configure webmux.
#
# The server listens on a unix socket only — no TCP, no TLS, no auth. The
# socket is 0600 inside the 0700 runtime dir, so filesystem permissions are
# the access control; connect from another machine with the Electron client,
# which forwards the socket over SSH (docs/electron-client.md).

# Name of the pty host daemon this server fronts (default: "default").
# Sessions live in the named host and survive web server restarts; different
# names give fully independent hosts, so several webmux instances can run
# side by side. Env var WEBMUX_PTYHOST overrides this.
#ptyhost: default

# Where the HTTP server listens (default:
# $XDG_RUNTIME_DIR/webmux/<ptyhost>.http.sock). The path is advertised in
# ~/.webmux/<ptyhost>.http.sock.path for the client's auto-discovery, so
# overriding it needs no client-side change.
#socket: /run/user/1000/webmux/default.http.sock
