    /* Palette tokens. The dark scheme is the default; the light scheme
       overrides the same tokens under [data-theme="light"], which
       settings.js sets on <html> (the terminal canvas gets its palette
       from THEMES there). Keep both lists in the same order. */
    :root {

      --panel: #1f1f2b;
      --border: #34344a;
      --text: #c8c8d8;

      --accent-tint-faint: rgba(122, 162, 247, 0.07); /* drop target wash */
      --selection-bg: rgba(122, 162, 247, 0.3);       /* file-browser cursor row */
      --selection-fg: #fff;
      --yellow-tint: rgba(224, 175, 104, 0.22);       /* focused pane's title bar */

      --unfocus-fade: 0.4;

    :root[data-theme="light"] {

      --bg: #dfe1e8;
      --panel: #f4f5f9;
      --border: #c4c8d8;
      --text: #343b58;
      --accent: #2e7de9;
      --accent-fg: #ffffff;
      --accent-yellow: #8c6c3e;
      --danger: #c8283f;
      --raise: rgba(0, 0, 0, 0.03);
      --raise-strong: rgba(0, 0, 0, 0.07);
      --hover: rgba(0, 0, 0, 0.05);
      --accent-tint: rgba(46, 125, 233, 0.14);
      --accent-tint-faint: rgba(46, 125, 233, 0.07);
      --selection-bg: rgba(46, 125, 233, 0.28);
      --selection-fg: #1b2140;
      --yellow-tint: rgba(140, 108, 62, 0.18);

      --overlay: rgba(40, 44, 70, 0.35);
      --shadow: rgba(30, 34, 60, 0.25);

    * { box-sizing: border-box; }
    /* Scrollbars everywhere (terminal viewport included): transparent track,
       light translucent pill. The transparent border + padding-box clip keeps
       the pill slim and inset from the edge. */

    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-corner { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 99px;

    @supports not selector(::-webkit-scrollbar) {
      * { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
    }

      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100vh;

      flex-direction: column;

    /* Transient status toast (clipboard syncs, upload progress, errors) —
       floats so it works with or without the in-page header. Accent-on-dark
       so it can't be missed against the near-black terminal background; it
       rises in from just below its resting spot. */
    #toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(640px, calc(100vw - 36px));
      background: var(--accent);
      color: var(--accent-fg);
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      box-shadow: 0 10px 32px var(--shadow), 0 0 0 1px var(--ring);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
      z-index: 200;

    #toast.show { opacity: 1; transform: translateY(0); }
    /* The scrolling strip of columns (app.js applyColumnWidths). Columns
       are flex items with a basis of --col-min (the strip's width split as
       many ways as the minimum-width setting allows, in pixels) and no
       shrink: while they all fit they grow to share the width, up to
       --col-max, and sit centred (safe center falls back to the start
       when they overflow, so nothing is scrolled out of reach); past that
       the strip overflows into a horizontal scroll. The min(…, 100%)
       keeps a column no wider than a window that is itself narrower than
       the minimum. position: relative makes column offsetLeft
       strip-relative for the scroll-into-view math. */
    #layout {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: safe center;
      gap: 6px;
      padding: 6px;
      min-height: 0;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
    }
    .column {
      flex: 1 0 min(var(--col-min, 600px), 100%);
      max-width: var(--col-max, 100%);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .column.full { flex-basis: 100%; max-width: 100%; } /* ⌘F: the whole window */
    /* Keeps the strip's old scroll extent open while a layout animation
       runs (app.js animateStrip). */
    .strip-extent { position: absolute; top: 0; width: 1px; height: 1px; visibility: hidden; pointer-events: none; }
    /* Divider between stacked panes: drag to reassign heights. */
    .divider {
      flex: none;
      height: 6px;
      margin: 1px 0;
      cursor: row-resize;
      background: var(--border);
      border-radius: 3px;
      transition: background 0.15s;
      touch-action: none;
    }
    .divider:hover, .divider:active { background: var(--accent); }
    .pane {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    /* The focused pane wears a 2px accent ring: its own border plus a
       1px outer shadow, which the 6px gaps leave room for. */
    .pane.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .pane-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      font-size: 12px;
      background: var(--raise);
      border-bottom: 1px solid var(--border);
      flex: none;
      min-width: 0;
    }
    .pane.focused .pane-bar {
      background: var(--yellow-tint);
      color: var(--accent-yellow);
      font-weight: 600;
    }
    .pane-icon {
      flex: none;
      display: inline-flex;
      opacity: 0.55;
      padding-left: 4px;
    }
    .pane-label {
      flex: 1;
      min-width: 0;
      padding: 2px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: none;
    }
    .pane-close {
      flex: none;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 10px;
      opacity: 0.5;
      padding: 0 4px;
    }
    .pane-close:hover { opacity: 1; color: var(--danger); }
    .pane-body {
      position: relative; /* anchors the fade overlay below */
      flex: 1;
      display: flex;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      transition: opacity 0.12s;
    }
    /* Unfocused panes dim by the fade setting: both factors scale linearly
       with --unfocus-fade, so 0.4 is the original brightness(0.72) /
       opacity 0.85 look. The darkening is a black overlay rather than a
       CSS filter: a filter makes Chromium render the whole pane to an
       offscreen surface and re-run it on every terminal repaint, which
       adds up across several visible splits; an overlay at alpha a
       multiplies every pixel by (1 - a) exactly like brightness(1 - a)
       does, at the cost of one blended quad. Both rules are gated on the
       html attribute settings.js sets only when the fade is above 0, so
       0% leaves the panes completely untouched. */
    :root[data-unfocus-fade] .pane:not(.focused) .pane-body {
      opacity: calc(1 - 0.375 * var(--unfocus-fade));
    }
    .pane-body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
      z-index: 1; /* above the terminal canvas layers */
    }
    :root[data-unfocus-fade] .pane:not(.focused) .pane-body::after {
      opacity: calc(0.7 * var(--unfocus-fade));
    }
    /* While a layout animation has a pane's box in flight (app.js
       animateStrip) its body is pinned at its final size, so a shrinking
       box shows some of the pane's own background beside or below the
       body. Darken that bare part exactly as the overlay darkens the body:
       a shadow of the body, spread wide and pushed down by the same amount
       so its top edge is the body's, painted inside the body's opacity
       group like the overlay is. It stops at the body's top, so the bar
       above — translucent, so any tint under it would show through — keeps
       its colour; the pane's overflow clips the rest. */
    :root[data-unfocus-fade] .pane.in-flight:not(.focused) .pane-body {
      box-shadow: 0 9999px 0 9999px rgba(0, 0, 0, calc(0.7 * var(--unfocus-fade)));
    }
    .tile {

    /* File browser widget (Miller columns) */

      overflow-y: hidden;
      outline: none;
      min-width: 0;
      min-height: 0;

    .files-entry.hidden-file .files-name { opacity: 0.55; }

    .files-name.symlink { font-style: italic; }

    .files-rename {
      flex: 1;

      font: inherit;
      color: var(--text);
      background: var(--input-bg);

      padding: 0 3px;

    /* Column enter/leave: new columns grow out of their parent while removed
       ones collapse, so navigation slides instead of jumping. The implicit
       keyframe endpoint picks up each column's own width (200px listing,
       600px preview). .leaving must come after .entering so it wins when a
       column is recycled mid-animation. */
    .files-col.entering { animation: files-col-in 180ms ease-out; }
    .files-col.leaving {
      animation: files-col-out 180ms ease-in forwards;
      overflow: hidden;
      pointer-events: none;

    .files-col.leaving .files-name { text-overflow: clip; } /* no ellipsis churn while collapsing */
    .files-col.swapping { animation: files-fade-in 140ms ease-out; } /* same-slot sibling swap */
    @keyframes files-col-in { from { width: 0; opacity: 0; } }
    @keyframes files-col-out { to { width: 0; opacity: 0; } }

    /* Wide enough for 80 cols of the 11.5px mono preview (80 × 6.9px = 552px)

    .files-preview { width: 600px; padding: 0; }

    /* Modals (link chooser, settings): a dimming overlay with a panel box. */
    .modal-overlay {
