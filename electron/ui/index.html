<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webmux</title>
  <script>
    // The Electron client draws its own header strip with these same actions;
    // hide the in-page header there (before first paint) so the chrome stays
    // a single row.
    if (navigator.userAgent.includes('Electron/')) {
      document.documentElement.classList.add('electron');
    }
  </script>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="preload" href="/fonts/JetBrainsMonoNerdFont-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-Bold.woff2') format('woff2');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-Italic.woff2') format('woff2');
      font-weight: normal;
      font-style: italic;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font';
      src: url('/fonts/JetBrainsMonoNerdFont-BoldItalic.woff2') format('woff2');
      font-weight: bold;
      font-style: italic;
    }
    /* Palette tokens. The dark scheme is the default; the light scheme
       overrides the same tokens under [data-theme="light"], which
       settings.js sets on <html> (the terminal canvas gets its palette
       from THEMES there). Keep both lists in the same order. */
    :root {
      color-scheme: dark;
      --bg: #16161e;
      --panel: #1f1f2b;
      --border: #34344a;
      --text: #c8c8d8;
      --accent: #7aa2f7;
      --accent-fg: #10101a;          /* text on an accent-filled button */
      --accent-yellow: #e0af68;
      --danger: #f7768e;
      --focus-border: #4a4a68;       /* focused pane outline */
      --raise: rgba(255, 255, 255, 0.03);        /* pane bar */
      --raise-strong: rgba(255, 255, 255, 0.1);  /* focused pane bar, on-path rows */
      --hover: rgba(255, 255, 255, 0.05);
      --accent-tint: rgba(122, 162, 247, 0.15);       /* active tab */
      --accent-tint-faint: rgba(122, 162, 247, 0.07); /* drop target wash */
      --selection-bg: rgba(122, 162, 247, 0.3);       /* file-browser cursor row */
      --selection-fg: #fff;
      --yellow-tint: rgba(224, 175, 104, 0.22);       /* active tab in the focused pane */
      --input-bg: rgba(0, 0, 0, 0.4);
      --overlay: rgba(0, 0, 0, 0.55);
      --shadow: rgba(0, 0, 0, 0.6);
      --ring: rgba(255, 255, 255, 0.12);
      --scrollbar: rgba(200, 200, 216, 0.22);
      --scrollbar-hover: rgba(200, 200, 216, 0.4);
      /* Unfocused-pane fade strength, 0–1 (the "fade %" setting / 100). */
      --unfocus-fade: 0.4;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #dfe1e8;
      --panel: #f4f5f9;
      --border: #c4c8d8;
      --text: #343b58;
      --accent: #2e7de9;
      --accent-fg: #ffffff;
      --accent-yellow: #8c6c3e;
      --danger: #c8283f;
      --focus-border: #9ca2bd;
      --raise: rgba(0, 0, 0, 0.03);
      --raise-strong: rgba(0, 0, 0, 0.07);
      --hover: rgba(0, 0, 0, 0.05);
      --accent-tint: rgba(46, 125, 233, 0.14);
      --accent-tint-faint: rgba(46, 125, 233, 0.07);
      --selection-bg: rgba(46, 125, 233, 0.28);
      --selection-fg: #1b2140;
      --yellow-tint: rgba(140, 108, 62, 0.18);
      --input-bg: rgba(255, 255, 255, 0.7);
      --overlay: rgba(40, 44, 70, 0.35);
      --shadow: rgba(30, 34, 60, 0.25);
      --ring: rgba(0, 0, 0, 0.08);
      --scrollbar: rgba(52, 59, 88, 0.25);
      --scrollbar-hover: rgba(52, 59, 88, 0.45);
    }
    * { box-sizing: border-box; }
    /* Scrollbars everywhere (terminal viewport included): transparent track,
       light translucent pill. The transparent border + padding-box clip keeps
       the pill slim and inset from the edge. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-corner { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-hover); }
    /* Firefox (no ::-webkit-scrollbar): standard properties. Kept out of
       Chromium, where scrollbar-color would disable the styles above. */
    @supports not selector(::-webkit-scrollbar) {
      * { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .electron header { display: none; } /* the client's header strip replaces it */
    header button {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    header button:hover { filter: brightness(1.1); }
    header button.secondary {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
    }
    header button.secondary:hover { border-color: var(--accent); color: var(--accent); filter: none; }
    header .spacer { flex: 1; }
    header button.icon { padding: 5px 9px; font-size: 15px; line-height: 1; }
    /* Transient status toast (clipboard syncs, upload progress, errors) —
       floats so it works with or without the in-page header. Accent-on-dark
       so it can't be missed against the near-black terminal background; it
       rises in from just below its resting spot. */
    #toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(640px, calc(100vw - 36px));
      background: var(--accent);
      color: var(--accent-fg);
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      box-shadow: 0 10px 32px var(--shadow), 0 0 0 1px var(--ring);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
      z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #layout {
      flex: 1;
      display: flex;
      padding: 6px;
      min-height: 0;
      min-width: 0;
    }
    #layout > * { flex: 1 1 0; }
    .split {
      display: flex;
      min-width: 0;
      min-height: 0;
    }
    .split.row { flex-direction: row; }
    .split.col { flex-direction: column; }
    .divider {
      flex: none;
      background: var(--border);
      border-radius: 3px;
      transition: background 0.15s;
      touch-action: none;
    }
    .divider:hover, .divider:active { background: var(--accent); }
    .divider.row { width: 6px; cursor: col-resize; margin: 0 1px; }
    .divider.col { height: 6px; cursor: row-resize; margin: 1px 0; }
    .pane {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .pane.drop-target { border-color: var(--accent); }
    .pane.focused { border-color: var(--focus-border); }
    .pane-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      font-size: 12px;
      background: var(--raise);
      border-bottom: 1px solid var(--border);
      flex: none;
      min-width: 0;
    }
    .pane.focused .pane-bar { background: var(--raise-strong); }
    .tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      min-width: 0;
      scrollbar-width: none;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 120px;
      max-width: 400px;
      padding: 2px 4px 2px 9px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      opacity: 0.55;
    }
    .tab-icon {
      flex: none;
      display: inline-flex;
      opacity: 0.55;
    }
    .tab-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab:hover { opacity: 0.9; background: var(--hover); }
    .tab.active { opacity: 1; background: var(--accent-tint); color: var(--accent); }
    .pane.focused .tab.active {
      background: var(--yellow-tint);
      color: var(--accent-yellow);
      font-weight: 600;
    }
    .tab.dragging { opacity: 0.3; }
    .tab.drop-before { box-shadow: -2px 0 0 0 var(--accent); }
    .tab.drop-after { box-shadow: 2px 0 0 0 var(--accent); }
    .tab-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 10px;
      opacity: 0.5;
      padding: 0 3px;
    }
    .tab-close:hover { opacity: 1; color: var(--danger); }
    .new-tab, .pane-actions button {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      opacity: 0.6;
      padding: 0 4px;
    }
    .new-tab:hover, .pane-actions button:hover { opacity: 1; color: var(--accent); }
    .pane-actions { display: flex; gap: 2px; flex: none; margin-left: auto; }
    .pane-body {
      flex: 1;
      display: flex;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      transition: filter 0.12s, opacity 0.12s;
    }
    /* Unfocused panes dim by the fade setting: both factors scale linearly
       with --unfocus-fade, so 0 is untouched and 0.4 is the original
       brightness(0.72) / opacity 0.85. */
    .pane:not(.focused) .pane-body {
      filter: brightness(calc(1 - 0.7 * var(--unfocus-fade)));
      opacity: calc(1 - 0.375 * var(--unfocus-fade));
    }
    .tile {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .tile.exited { opacity: 0.5; }
    .term-holder { flex: 1; min-height: 0; padding: 4px; }
    .term-holder .xterm { height: 100%; }
    /* File browser widget (Miller columns) */
    .files-cols {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      outline: none;
      min-width: 0;
      min-height: 0;
    }
    .files-col {
      position: relative; /* makes row offsetTop column-relative (cursor reveal) */
      flex: none;
      width: 200px;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid var(--border);
      padding: 4px 0;
    }
    .files-entry {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12.5px;
      user-select: none;
    }
    .files-entry:hover { background: var(--hover); }
    .files-entry.on-path { background: var(--raise-strong); }
    .files-entry.cursor { background: var(--selection-bg); color: var(--selection-fg); }
    .files-entry.hidden-file .files-name { opacity: 0.55; }
    .files-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .files-name.symlink { font-style: italic; }
    .files-arrow { opacity: 0.5; font-size: 11px; }
    .files-acts { display: flex; gap: 2px; }
    .files-act {
      border: none;
      background: none;
      color: inherit;
      opacity: 0.55;
      font-size: 11px;
      line-height: 1;
      padding: 1px 3px;
      cursor: pointer;
    }
    .files-act:hover { opacity: 1; }
    .files-rename {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--accent);
      border-radius: 3px;
      padding: 0 3px;
      outline: none;
    }
    .files-msg { padding: 6px 10px; opacity: 0.5; font-size: 12px; font-style: italic; }
    /* Column enter/leave: new columns grow out of their parent while removed
       ones collapse, so navigation slides instead of jumping. The implicit
       keyframe endpoint picks up each column's own width (200px listing,
       600px preview). .leaving must come after .entering so it wins when a
       column is recycled mid-animation. */
    .files-col.entering { animation: files-col-in 180ms ease-out; }
    .files-col.leaving {
      animation: files-col-out 180ms ease-in forwards;
      overflow: hidden;
      pointer-events: none;
    }
    .files-col.leaving .files-name { text-overflow: clip; } /* no ellipsis churn while collapsing */
    .files-col.swapping { animation: files-fade-in 140ms ease-out; } /* same-slot sibling swap */
    @keyframes files-col-in { from { width: 0; opacity: 0; } }
    @keyframes files-col-out { to { width: 0; opacity: 0; } }
    .files-preview-inner { animation: files-fade-in 140ms ease-out; }
    @keyframes files-fade-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .files-col.entering, .files-col.leaving, .files-col.swapping,
      .files-preview-inner { animation-duration: 1ms; }
    }
    .files-col.drop-target, .files-cols.drop-target {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: var(--accent-tint-faint);
    }
    /* Wide enough for 80 cols of the 11.5px mono preview (80 × 6.9px = 552px)
       plus body padding, scrollbar, and a little buffer. */
    .files-preview { width: 600px; padding: 0; }
    .files-preview-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .files-preview-head {
      flex: none;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .files-preview-head .fname { font-weight: 600; word-break: break-all; }
    .files-preview-head .fmeta { opacity: 0.6; margin-top: 2px; }
    .files-preview-body {
      flex: 1;
      overflow: auto;
      padding: 8px 10px;
      min-height: 0;
    }
    .files-preview-body pre {
      margin: 0;
      font-family: 'JetBrainsMono Nerd Font', monospace;
      font-size: 11.5px;
      line-height: 1.45;
      white-space: pre;
    }
    .files-preview-body img { max-width: 100%; display: block; }
    /* Modals (link chooser, settings): a dimming overlay with a panel box. */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      max-width: min(560px, 90vw);
      box-shadow: 0 8px 32px var(--shadow);
    }
    .modal button {
      border: 1px solid var(--border);
      background: none;
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .modal button:hover { border-color: var(--accent); color: var(--accent); }
    .modal button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
    }
    .modal button.primary:hover { filter: brightness(1.1); color: var(--accent-fg); }
    .modal button.danger {
      background: #c34f5e;
      border-color: #c34f5e;
      color: #fff;
      font-weight: 600;
    }
    .modal button.danger:hover { filter: brightness(1.1); color: #fff; }
    .modal .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }
    .modal .hint {
      margin-right: auto;
      font-size: 11.5px;
      opacity: 0.55;
    }
    /* Link-click modal */
    .link-modal .link-url {
      font-family: 'JetBrainsMono Nerd Font', monospace;
      font-size: 12.5px;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 14px;
      max-height: 30vh;
      overflow-y: auto;
    }
    /* Settings modal: one row per client-wide setting (settings.js). */
    .settings-modal { width: min(460px, 90vw); }
    .settings-modal h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .settings-modal .lead { margin: 0 0 10px; font-size: 12px; opacity: 0.6; }
    .setting {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 14px;
      padding: 11px 0;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .setting .setting-label { font-weight: 600; }
    .setting .setting-desc { grid-column: 1 / -1; font-size: 11.5px; opacity: 0.6; margin-top: 3px; }
    .setting .setting-control { display: flex; align-items: center; gap: 8px; }
    .setting select {
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
    }
    .setting select:focus { outline: none; border-color: var(--accent); }
    .setting input[type="range"] { width: 170px; accent-color: var(--accent); cursor: pointer; }
    .setting output {
      min-width: 4ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }
    .settings-modal .actions { margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <button id="new-session">+ New terminal</button>
    <button id="new-files" class="secondary">+ Files</button>
    <span class="spacer"></span>
    <button id="settings" class="secondary icon" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <div id="layout"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
