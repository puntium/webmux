<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>webmux header</title>
<style>
  /* Matches the served page's palette (ui/index.html) — this strip sits
     directly above it and should read as the same chrome. */
  :root {
    --bg: #1f1f2b;
    --border: #34344a;
    --text: #c8c8d8;
    --accent: #7aa2f7;
    --accent-yellow: #e0af68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 38px;
    background: var(--bg);
    color: var(--text);
    border-bottom: 1px solid var(--border);
    font: 12.5px/1 system-ui, sans-serif;
    /* actions | pills | connections — equal side tracks keep the pills
       centered in the window, not in the leftover space */
    display: grid;
    grid-template-columns: 1fr minmax(0, auto) 1fr;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    user-select: none;
    overflow: hidden;
  }
  #actions { justify-self: start; display: flex; gap: 6px; }
  #actions button {
    border-radius: 6px;
    padding: 5px 11px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #newTermBtn { background: var(--accent); border: none; color: #10101a; }
  #newTermBtn:hover { filter: brightness(1.1); }
  #newFilesBtn { background: none; border: 1px solid var(--border); color: var(--text); opacity: 0.8; }
  #newFilesBtn:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
  #actions button:disabled { opacity: 0.3; cursor: default; filter: none; }
  #newFilesBtn:disabled { border-color: var(--border); color: var(--text); }
  #pills { justify-self: center; display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px 4px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    opacity: 0.7;
    flex: none;
  }
  .pill:hover { opacity: 1; background: rgba(255, 255, 255, 0.05); }
  .pill.active {
    opacity: 1;
    border-color: rgba(224, 175, 104, 0.6);
    background: rgba(224, 175, 104, 0.12);
    color: var(--accent-yellow);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
  .dot.connecting { background: var(--accent-yellow); animation: pulse 1.2s ease-in-out infinite; }
  .dot.retry, .dot.failed { background: #f7768e; }
  .dot.connected { background: #9ece6a; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .x {
    background: none;
    border: none;
    color: inherit;
    font-size: 10px;
    cursor: pointer;
    opacity: 0;
    padding: 2px 4px;
  }
  .pill:hover .x { opacity: 0.55; }
  /* Drag-to-reorder: the picked-up pill fades, an accent bar marks the
     insertion point on whichever neighbor the drop would land beside. */
  .pill.dragging { opacity: 0.3; }
  .pill.drop-before { box-shadow: -4px 0 0 -1px var(--accent); }
  .pill.drop-after { box-shadow: 4px 0 0 -1px var(--accent); }
  .x:hover { opacity: 1 !important; color: #f7768e; }
  #connectionsBtn {
    justify-self: end;
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font: inherit;
    padding: 5px 12px;
    cursor: pointer;
    opacity: 0.7;
  }
  #connectionsBtn:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
  #connectionsBtn.active {
    opacity: 1;
    border-color: rgba(122, 162, 247, 0.7);
    background: rgba(122, 162, 247, 0.12);
    color: var(--accent);
  }
</style>
</head>
<body>
<div id="actions">
  <button id="newTermBtn" title="New terminal tab in the focused pane" disabled>+ New terminal</button>
  <button id="newFilesBtn" title="New file-browser tab in the focused pane" disabled>+ Files</button>
</div>
<div id="pills"></div>
<button id="connectionsBtn" title="Manage connections (⌘⇧O)">Connections</button>

<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let snap = { active: null, connections: [] };

  const stateTip = (c) => ({
    connecting: 'connecting…',
    connected: 'connected',
    retry: `interrupted — retrying${c.delay ? ` in ${c.delay}s` : ''}`,
    failed: 'connection failed',
  }[c.state] || c.state);

  function render() {
    document.getElementById('pills').innerHTML = snap.connections.map((c, i) => `
      <span class="pill${c.name === snap.active ? ' active' : ''}"
            data-show="${esc(c.name)}" draggable="true"
            title="${esc(c.name)} — ${esc(stateTip(c))}${i < 9 ? ` (⌘${i + 1})` : ''}">
        <span class="dot ${esc(c.state)}"></span>${esc(c.name)}
        <button class="x" title="Disconnect" data-x="${esc(c.name)}">✕</button>
      </span>`).join('');
    document.getElementById('connectionsBtn').classList.toggle('active', snap.active === null);
    // The tab actions target the visible host page; on the connection page
    // there is nothing to act on.
    for (const btn of document.querySelectorAll('#actions button')) {
      btn.disabled = snap.active === null;
    }
  }

  document.getElementById('pills').addEventListener('click', (ev) => {
    const x = ev.target.closest('[data-x]');
    if (x) { webmux.disconnect(x.dataset.x); return; }
    const pill = ev.target.closest('[data-show]');
    if (pill) webmux.showConn(pill.dataset.show);
  });

  // Drag a pill to reorder hosts. The drop slot is decided by the pointer's
  // x against every other pill's midpoint (so gaps and the trailing edge
  // work too); the header reorders itself optimistically and main confirms
  // via the next conns broadcast (which also renumbers the ⌘<n> tooltips).
  const pillsEl = document.getElementById('pills');
  let dragName = null;
  const otherPills = () => [...pillsEl.querySelectorAll('[data-show]')]
    .filter((p) => p.dataset.show !== dragName);
  const dropSlot = (x) => otherPills()
    .filter((p) => { const r = p.getBoundingClientRect(); return r.left + r.width / 2 < x; }).length;
  const clearDropMarks = () => {
    for (const p of pillsEl.querySelectorAll('.drop-before, .drop-after')) {
      p.classList.remove('drop-before', 'drop-after');
    }
  };
  pillsEl.addEventListener('dragstart', (ev) => {
    const pill = ev.target.closest('[data-show]');
    if (!pill) { ev.preventDefault(); return; }
    dragName = pill.dataset.show;
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', dragName);
    pill.classList.add('dragging');
  });
  pillsEl.addEventListener('dragover', (ev) => {
    if (!dragName) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    clearDropMarks();
    const others = otherPills();
    const slot = dropSlot(ev.clientX);
    if (slot < others.length) others[slot].classList.add('drop-before');
    else others.at(-1)?.classList.add('drop-after');
  });
  pillsEl.addEventListener('drop', (ev) => {
    if (!dragName) return;
    ev.preventDefault();
    const names = snap.connections.map((c) => c.name).filter((n) => n !== dragName);
    names.splice(dropSlot(ev.clientX), 0, dragName);
    dragName = null;
    snap.connections.sort((a, b) => names.indexOf(a.name) - names.indexOf(b.name));
    render(); // also drops the dragging/drop-* classes
    webmux.reorderConns(names);
  });
  pillsEl.addEventListener('dragend', () => {
    dragName = null;
    clearDropMarks();
    pillsEl.querySelector('.dragging')?.classList.remove('dragging');
  });

  document.getElementById('connectionsBtn').addEventListener('click', () => webmux.showConn(null));
  document.getElementById('newTermBtn').addEventListener('click', () => webmux.chromeCmd('new-terminal'));
  document.getElementById('newFilesBtn').addEventListener('click', () => webmux.chromeCmd('new-files'));

  webmux.onConns((s) => { snap = s; render(); });
  (async () => { snap = await webmux.getConns(); render(); })();
</script>
</body>
</html>
